name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release

      - name: Plugin hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SimpleDelay-VST3
          path: build/SimpleDelay_artefacts/Release/VST3/
